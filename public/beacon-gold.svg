<?xml version="1.0" encoding="UTF-8"?>
<svg width="780" height="660" viewBox="0 0 780 660" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softShadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E7C465"/>
      <stop offset="100%" stop-color="#B98F2D"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="170" y="110" width="440" height="440" rx="96" ry="96"
        fill="#161A33" filter="url(#softShadow)"/>

  <!-- Letterform: B -->
  <text x="325" y="440"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="800"
        font-size="300"
        fill="#FFFFFF"
        text-anchor="middle">B</text>

  <!-- Gold accent squares (echoing the reference's colon motif) -->
  <rect x="478" y="322" width="46" height="46" fill="url(#goldGradient)"/>
  <rect x="478" y="392" width="46" height="46" fill="url(#goldGradient)"/>
</svg>
